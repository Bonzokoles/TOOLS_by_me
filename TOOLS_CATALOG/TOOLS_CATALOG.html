<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENO — Katalog Narzędzi</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161b24;
    --surface2: #1e2533;
    --border: #2a3347;
    --accent: #4f8ef7;
    --accent2: #7c5cbf;
    --green: #3dd68c;
    --yellow: #f0c040;
    --red: #e05c5c;
    --gray: #6b7a99;
    --text: #d8e0f0;
    --text2: #8899bb;
    --radius: 10px;
    --card-w: 220px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  /* ── HEADER ─────────────────────────────────────── */
  header {
    background: linear-gradient(135deg, #101828 0%, #1a1040 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; }
  header h1 span { color: var(--accent); }
  .header-meta { font-size: .78rem; color: var(--gray); }
  .add-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 7px;
    padding: 8px 18px; font-size: .88rem; font-weight: 600; cursor: pointer;
    transition: background .2s;
  }
  .add-btn:hover { background: #3a78e0; }

  /* ── LAYOUT ─────────────────────────────────────── */
  .layout { display: flex; min-height: calc(100vh - 65px); }

  /* ── SIDEBAR ────────────────────────────────────── */
  aside {
    width: 200px; min-width: 200px; background: var(--surface);
    border-right: 1px solid var(--border); padding: 20px 0;
    position: sticky; top: 65px; height: calc(100vh - 65px); overflow-y: auto;
  }
  .cat-btn {
    display: flex; align-items: center; gap: 9px;
    width: 100%; padding: 9px 20px; background: none; border: none;
    color: var(--text2); font-size: .88rem; cursor: pointer; text-align: left;
    border-left: 3px solid transparent; transition: all .15s;
  }
  .cat-btn:hover { background: var(--surface2); color: var(--text); }
  .cat-btn.active { background: var(--surface2); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
  .cat-btn .count {
    margin-left: auto; background: var(--border); border-radius: 10px;
    padding: 1px 7px; font-size: .72rem; color: var(--gray);
  }
  .cat-btn.active .count { background: var(--accent); color: #fff; }
  .sidebar-sep { border: none; border-top: 1px solid var(--border); margin: 10px 16px; }

  /* ── MAIN ───────────────────────────────────────── */
  main { flex: 1; padding: 28px 32px; overflow-y: auto; }
  .section-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 22px;
  }
  .section-header h2 { font-size: 1.2rem; font-weight: 700; }
  .section-header .section-icon { font-size: 1.4rem; }
  .section-desc { font-size: .82rem; color: var(--gray); margin-left: auto; }

  /* ── SEARCH ─────────────────────────────────────── */
  .topbar { display: flex; gap: 12px; margin-bottom: 24px; align-items: center; }
  .search-wrap { flex: 1; position: relative; }
  .search-wrap input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 14px 9px 36px; color: var(--text);
    font-size: .9rem; outline: none; transition: border .2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap::before { content: '🔍'; position: absolute; left: 11px; top: 8px; font-size: .85rem; }
  .filter-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text2); font-size: .78rem; cursor: pointer; transition: all .15s;
  }
  .filter-btn:hover, .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,.1); }

  /* ── CARDS GRID ─────────────────────────────────── */
  .cards { display: flex; flex-wrap: wrap; gap: 14px; }
  .card {
    width: var(--card-w); background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; cursor: pointer;
    transition: transform .15s, border-color .15s, box-shadow .15s;
    position: relative; display: flex; flex-direction: column; gap: 8px;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 4px 20px rgba(79,142,247,.15); }
  .card-icon { font-size: 1.5rem; }
  .card-name { font-size: .95rem; font-weight: 700; color: var(--text); line-height: 1.2; }
  .card-desc { font-size: .78rem; color: var(--text2); line-height: 1.5; flex: 1; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tag {
    font-size: .68rem; padding: 2px 7px; border-radius: 4px;
    background: var(--surface2); color: var(--gray); border: 1px solid var(--border);
  }
  .tag.rust { background: rgba(247,76,0,.1); color: #f74c00; border-color: rgba(247,76,0,.2); }
  .tag.python { background: rgba(55,163,255,.1); color: #37a3ff; border-color: rgba(55,163,255,.2); }
  .tag.go { background: rgba(0,217,172,.1); color: #00d9ac; border-color: rgba(0,217,172,.2); }
  .tag.ts { background: rgba(49,120,198,.1); color: #3178c6; border-color: rgba(49,120,198,.2); }
  .tag.java { background: rgba(237,144,90,.1); color: #ed905a; border-color: rgba(237,144,90,.2); }
  .tag.ai { background: rgba(150,80,250,.1); color: #9650fa; border-color: rgba(150,80,250,.2); }
  .tag.selfhosted { background: rgba(61,214,140,.1); color: #3dd68c; border-color: rgba(61,214,140,.2); }

  /* ── STATUS BADGE ───────────────────────────────── */
  .status-badge {
    position: absolute; top: 10px; right: 10px;
    font-size: .65rem; padding: 2px 7px; border-radius: 20px; font-weight: 700;
  }
  .status-todo { background: rgba(107,122,153,.15); color: var(--gray); border: 1px solid var(--border); }
  .status-priority { background: rgba(240,192,64,.15); color: var(--yellow); border: 1px solid rgba(240,192,64,.3); }
  .status-deploy { background: rgba(61,214,140,.15); color: var(--green); border: 1px solid rgba(61,214,140,.3); }
  .status-reject { background: rgba(224,92,92,.15); color: var(--red); border: 1px solid rgba(224,92,92,.3); }

  /* ── MODAL ──────────────────────────────────────── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
    z-index: 1000; align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 32px; max-width: 600px; width: 90%;
    max-height: 85vh; overflow-y: auto; position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px; background: var(--surface2);
    border: none; color: var(--text2); font-size: 1.2rem; cursor: pointer;
    border-radius: 6px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { color: var(--text); background: var(--border); }
  .modal h2 { font-size: 1.3rem; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
  .modal .cat-label { font-size: .75rem; color: var(--gray); margin-bottom: 16px; }
  .modal .modal-desc { color: var(--text2); line-height: 1.7; font-size: .92rem; margin-bottom: 20px; }
  .modal .modal-readme {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; font-size: .85rem; color: var(--text); line-height: 1.7;
    margin-bottom: 20px; white-space: pre-wrap;
  }
  .modal-links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .link-btn {
    padding: 9px 18px; border-radius: 8px; border: none; font-size: .88rem;
    font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex;
    align-items: center; gap: 6px; transition: opacity .15s;
  }
  .link-btn:hover { opacity: .85; }
  .link-btn.primary { background: var(--accent); color: #fff; }
  .link-btn.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .modal-status-row {
    display: flex; align-items: center; gap: 10px; margin-top: 18px; padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .modal-status-row span { font-size: .82rem; color: var(--gray); }
  .status-select {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 10px; font-size: .82rem; cursor: pointer;
  }

  /* ── ADD FORM ───────────────────────────────────── */
  .add-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
    z-index: 1000; align-items: center; justify-content: center;
  }
  .add-overlay.open { display: flex; }
  .add-modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 32px; max-width: 520px; width: 90%;
    position: relative;
  }
  .add-modal h2 { font-size: 1.1rem; margin-bottom: 20px; }
  .form-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .form-row label { font-size: .8rem; color: var(--text2); }
  .form-row input, .form-row textarea, .form-row select {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 7px; padding: 9px 12px; font-size: .88rem;
    outline: none; font-family: inherit; transition: border .2s;
  }
  .form-row input:focus, .form-row textarea:focus { border-color: var(--accent); }
  .form-row textarea { height: 80px; resize: vertical; }
  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .btn-save { background: var(--accent); color: #fff; border: none; border-radius: 7px; padding: 9px 22px; font-size: .9rem; font-weight: 600; cursor: pointer; }
  .btn-cancel { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); border-radius: 7px; padding: 9px 18px; font-size: .9rem; cursor: pointer; }

  /* ── AUTO-FETCH ─────────────────────────────────── */
  .autofetch-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
    z-index: 1000; align-items: center; justify-content: center;
  }
  .autofetch-overlay.open { display: flex; }
  .autofetch-modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 32px; max-width: 580px; width: 92%;
    position: relative; max-height: 90vh; overflow-y: auto;
  }
  .autofetch-modal h2 { font-size: 1.1rem; margin-bottom: 18px; }
  .af-url-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .af-url-row input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 7px; padding: 10px 14px; font-size: .9rem;
    outline: none; transition: border .2s;
  }
  .af-url-row input:focus { border-color: var(--accent); }
  .af-fetch-btn {
    background: linear-gradient(135deg, #4f8ef7, #7c5cbf); color: #fff; border: none;
    border-radius: 7px; padding: 10px 18px; font-size: .88rem; font-weight: 600;
    cursor: pointer; white-space: nowrap; transition: opacity .2s;
  }
  .af-fetch-btn:hover { opacity: .85; }
  .af-fetch-btn:disabled { opacity: .5; cursor: not-allowed; }
  .af-status { font-size: .82rem; color: var(--gray); margin-bottom: 14px; min-height: 20px; }
  .af-status.error { color: var(--red); }
  .af-status.success { color: var(--green); }
  .af-preview {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; margin-bottom: 18px; display: none;
  }
  .af-preview.visible { display: block; }
  .af-preview-row { margin-bottom: 10px; }
  .af-preview-row label { font-size: .75rem; color: var(--text2); display: block; margin-bottom: 3px; }
  .af-preview-row input, .af-preview-row textarea, .af-preview-row select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 7px 10px; font-size: .85rem;
    outline: none; font-family: inherit;
  }
  .af-preview-row textarea { height: 60px; resize: vertical; }
  .af-preview-row .af-tags-display { font-size: .78rem; color: var(--accent); }
  .af-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .header-btns { display: flex; gap: 8px; align-items: center; }
  .auto-fetch-header-btn {
    background: linear-gradient(135deg, #4f8ef7, #7c5cbf); color: #fff; border: none;
    border-radius: 7px; padding: 8px 18px; font-size: .88rem; font-weight: 600;
    cursor: pointer; transition: opacity .2s;
  }
  .auto-fetch-header-btn:hover { opacity: .85; }
  .tag.dotnet { background: rgba(81,43,212,.1); color: #7c5cbf; border-color: rgba(81,43,212,.2); }

  /* ── STAR RATING ─────────────────────────────────── */
  .card-stars {
    position: absolute; top: 10px; left: 10px;
    font-size: .7rem; letter-spacing: 1px; line-height: 1;
    filter: drop-shadow(0 0 2px rgba(240,192,64,.4));
  }
  .star-rating {
    display: inline-flex; gap: 2px; font-size: .95rem; cursor: pointer; user-select: none;
  }
  .star-rating .star { color: var(--border); transition: color .15s; }
  .star-rating .star.filled { color: var(--yellow); text-shadow: 0 0 6px rgba(240,192,64,.4); }
  .star-rating .star:hover { color: var(--yellow); }
  .star-rating-display {
    display: inline-flex; gap: 1px; font-size: .85rem; user-select: none;
  }
  .star-rating-display .star { color: var(--border); }
  .star-rating-display .star.filled { color: var(--yellow); }
  .star-filter-row {
    display: flex; gap: 6px; align-items: center; margin-left: 12px;
  }
  .star-filter-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text2); font-size: .78rem; padding: 4px 10px; cursor: pointer;
    transition: all .15s;
  }
  .star-filter-btn:hover { border-color: var(--yellow); color: var(--yellow); }
  .star-filter-btn.active { background: rgba(240,192,64,.12); border-color: var(--yellow); color: var(--yellow); font-weight: 700; }
  .modal-stars-row {
    display: flex; align-items: center; gap: 12px; margin-top: 14px;
    padding-top: 14px; border-top: 1px solid var(--border);
  }
  .modal-stars-row span { font-size: .82rem; color: var(--gray); }
  .modal-stars-row .star-rating { font-size: 1.3rem; }
  .star-saved-note {
    font-size: .78rem; color: var(--green); opacity: 0; transition: opacity .3s;
  }
  .star-saved-note.show { opacity: 1; }

  /* ── EMPTY STATE ────────────────────────────────── */
  .empty { padding: 60px; text-align: center; color: var(--gray); }
  .empty .empty-icon { font-size: 3rem; margin-bottom: 12px; }

  /* ── STATS BAR ──────────────────────────────────── */
  .stats-bar {
    display: flex; gap: 20px; margin-bottom: 24px; flex-wrap: wrap;
  }
  .stat-pill {
    display: flex; align-items: center; gap: 7px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px;
    font-size: .8rem;
  }
  .stat-pill .n { font-weight: 700; color: var(--accent); }

  @media (max-width: 700px) {
    aside { display: none; }
    main { padding: 16px; }
    .cards { justify-content: center; }
  }
</style>
</head>
<body>

<!-- ══════════ HEADER ══════════ -->
<header>
  <h1>⚡ <span>ZENO</span> — Katalog Narzędzi</h1>
  <span class="header-meta" id="lastUpdate">Ostatnia aktualizacja: 14.03.2026</span>
  <div class="header-btns">
    <button class="auto-fetch-header-btn" onclick="openAutoFetch()">🔗 Auto-fetch z URL</button>
    <button class="add-btn" onclick="openAdd()">+ Dodaj ręcznie</button>
  </div>
</header>

<div class="layout">

<!-- ══════════ SIDEBAR ══════════ -->
<aside id="sidebar"></aside>

<!-- ══════════ MAIN ══════════ -->
<main>
  <div class="topbar">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Szukaj narzędzia..." oninput="renderCards()">
    </div>
    <div class="filter-btns" id="statusFilters">
      <button class="filter-btn active" data-status="all" onclick="setStatusFilter(this,'all')">Wszystkie</button>
      <button class="filter-btn" data-status="priority" onclick="setStatusFilter(this,'priority')">⭐ Priorytet</button>
      <button class="filter-btn" data-status="deploy" onclick="setStatusFilter(this,'deploy')">✅ Wdrożone</button>
      <button class="filter-btn" data-status="reject" onclick="setStatusFilter(this,'reject')">❌ Odrzucone</button>
      <button class="filter-btn" data-status="todo" onclick="setStatusFilter(this,'todo')">🔍 Do sprawdzenia</button>
    </div>
    <div class="star-filter-row">
      <button class="star-filter-btn active" onclick="setStarFilter(this,0)">Wszystkie</button>
      <button class="star-filter-btn" onclick="setStarFilter(this,1)">⭐</button>
      <button class="star-filter-btn" onclick="setStarFilter(this,2)">⭐⭐</button>
      <button class="star-filter-btn" onclick="setStarFilter(this,3)">⭐⭐⭐</button>
    </div>
  </div>
  <div class="stats-bar" id="statsBar"></div>
  <div id="cardsContainer"></div>
</main>

</div>

<!-- ══════════ CARD MODAL ══════════ -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <h2 id="mIcon"></h2>
    <div class="cat-label" id="mCat"></div>
    <div class="modal-desc" id="mDesc"></div>
    <div class="modal-readme" id="mReadme"></div>
    <div class="modal-links" id="mLinks"></div>
    <div class="modal-stars-row">
      <span>Ocena:</span>
      <div class="star-rating" id="mStarRating"></div>
      <span class="star-saved-note" id="starSavedNote">✓</span>
    </div>
    <div class="modal-status-row">
      <span>Status:</span>
      <select class="status-select" id="mStatusSel" onchange="changeStatus(this.value)"></select>
      <span id="mStatusNote" style="font-size:.78rem;color:var(--gray)"></span>
    </div>
  </div>
</div>

<!-- ══════════ ADD MODAL ══════════ -->
<div class="add-overlay" id="addOverlay" onclick="closeAdd(event)">
  <div class="add-modal">
    <button class="modal-close" onclick="closeAddDirect()">✕</button>
    <h2>➕ Dodaj nowe narzędzie</h2>
    <div class="form-row-2">
      <div class="form-row">
        <label>Ikona (emoji)</label>
        <input type="text" id="fIcon" value="🔧" maxlength="4">
      </div>
      <div class="form-row">
        <label>Kategoria</label>
        <select id="fCat"></select>
      </div>
    </div>
    <div class="form-row">
      <label>Nazwa *</label>
      <input type="text" id="fName" placeholder="np. Typesense">
    </div>
    <div class="form-row">
      <label>Krótki opis (karta)</label>
      <input type="text" id="fDesc" placeholder="max 80 znaków">
    </div>
    <div class="form-row">
      <label>Pełny opis / README</label>
      <textarea id="fReadme" placeholder="Szczegółowy opis, cechy, uwagi..."></textarea>
    </div>
    <div class="form-row">
      <label>URL główny *</label>
      <input type="text" id="fUrl" placeholder="https://github.com/...">
    </div>
    <div class="form-row">
      <label>URL dokumentacji (opcjonalnie)</label>
      <input type="text" id="fDocs" placeholder="https://docs...">
    </div>
    <div class="form-row-2">
      <div class="form-row">
        <label>Tagi (oddziel przecinkiem)</label>
        <input type="text" id="fTags" placeholder="rust, selfhosted, ai">
      </div>
      <div class="form-row">
        <label>Status</label>
        <select id="fStatus">
          <option value="todo">🔍 Do sprawdzenia</option>
          <option value="priority">⭐ Priorytet</option>
          <option value="deploy">✅ Wdrożone</option>
          <option value="reject">❌ Odrzucone</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <label>Ocena (gwiazdki 0-3)</label>
      <div class="star-rating" id="fStarRating" data-value="0"></div>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closeAddDirect()">Anuluj</button>
      <button class="btn-save" onclick="saveNewTool()">💾 Zapisz</button>
    </div>
  </div>
</div>

<!-- ══════════ AUTO-FETCH MODAL ══════════ -->
<div class="autofetch-overlay" id="afOverlay" onclick="closeAutoFetch(event)">
  <div class="autofetch-modal">
    <button class="modal-close" onclick="closeAutoFetchDirect()">✕</button>
    <h2>🔗 Auto-fetch — dodaj narzędzie z URL</h2>
    <p style="font-size:.82rem;color:var(--text2);margin-bottom:14px;">
      Wklej URL strony lub repo GitHub — automatycznie pobierzemy nazwę, opis, tagi i kategorię.
    </p>
    <div class="af-url-row">
      <input type="text" id="afUrl" placeholder="https://github.com/user/repo lub https://example.com" autocomplete="off">
      <button class="af-fetch-btn" id="afFetchBtn" onclick="doAutoFetch()">⚡ Pobierz</button>
    </div>
    <div class="af-status" id="afStatus"></div>

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let activeCat = 'all';
let activeStatus = 'all';
let activeStarFilter = 0; // 0 = all, 1/2/3 = min stars
let currentToolId = null;

const STATUS_LABELS = {
  todo:     { label: '🔍 Do sprawdzenia', cls: 'status-todo' },
  priority: { label: '⭐ Priorytet',      cls: 'status-priority' },
  deploy:   { label: '✅ Wdrożone',       cls: 'status-deploy' },
  reject:   { label: '❌ Odrzucone',      cls: 'status-reject' },
  bookmark: { label: '📚 Zapamiętaj',     cls: 'status-todo' },
};

// ═══════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════
function renderAll() {
  renderSidebar();
  renderCards();
}

function renderSidebar() {
  const aside = document.getElementById('sidebar');
  const allCount = tools.length;
  let html = `<button class="cat-btn ${activeCat==='all'?'active':''}" onclick="setCat('all')">
    🗂️ Wszystkie <span class="count">${allCount}</span>
  </button><hr class="sidebar-sep">`;

  CATEGORIES.forEach(c => {
    const n = tools.filter(t => t.cat === c.id).length;
    if (n === 0) return;
    html += `<button class="cat-btn ${activeCat===c.id?'active':''}" onclick="setCat('${c.id}')">
      ${c.icon} ${c.name} <span class="count">${n}</span>
    </button>`;
  });
  aside.innerHTML = html;
}

function renderCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let filtered = tools.filter(t => {
    const matchCat = activeCat === 'all' || t.cat === activeCat;
    const matchStatus = activeStatus === 'all' || t.status === activeStatus;
    const matchQ = !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || (t.tags||[]).join(' ').includes(q);
    const matchStars = activeStarFilter === 0 || (t.stars || 0) >= activeStarFilter;
    return matchCat && matchStatus && matchQ && matchStars;
  });

  // Stats
  const statsBar = document.getElementById('statsBar');
  const total = filtered.length;
  const priority = filtered.filter(t=>t.status==='priority').length;
  const deployed = filtered.filter(t=>t.status==='deploy').length;
  statsBar.innerHTML = `
    <div class="stat-pill"><span class="n">${total}</span> narzędzi</div>
    ${priority?`<div class="stat-pill">⭐ <span class="n">${priority}</span> priorytet</div>`:''}
    ${deployed?`<div class="stat-pill">✅ <span class="n">${deployed}</span> wdrożone</div>`:''}
    ${filtered.filter(t=>(t.stars||0)>=3).length?`<div class="stat-pill">⭐⭐⭐ <span class="n">${filtered.filter(t=>(t.stars||0)>=3).length}</span></div>`:''}
    ${filtered.filter(t=>(t.stars||0)===2).length?`<div class="stat-pill">⭐⭐ <span class="n">${filtered.filter(t=>(t.stars||0)===2).length}</span></div>`:''}
  `;

  if (!filtered.length) {
    document.getElementById('cardsContainer').innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>Brak wyników</div>';
    return;
  }

  // Group by category if "all"
  let html = '';
  if (activeCat === 'all') {
    const groups = {};
    filtered.forEach(t => { if (!groups[t.cat]) groups[t.cat] = []; groups[t.cat].push(t); });
    CATEGORIES.forEach(c => {
      if (!groups[c.id]) return;
      html += `<div class="section-header">
        <span class="section-icon">${c.icon}</span>
        <h2>${c.name}</h2>
        <span class="section-desc">${groups[c.id].length} narzędzi</span>
      </div>
      <div class="cards" style="margin-bottom:32px">
        ${groups[c.id].map(renderCard).join('')}
      </div>`;
    });
  } else {
    const cat = CATEGORIES.find(c=>c.id===activeCat);
    html = `<div class="section-header">
      <span class="section-icon">${cat?.icon||''}</span>
      <h2>${cat?.name||activeCat}</h2>
    </div>
    <div class="cards">${filtered.map(renderCard).join('')}</div>`;
  }
  document.getElementById('cardsContainer').innerHTML = html;
}

function renderStarsHtml(stars, small) {
  const n = stars || 0;
  if (n === 0 && small) return '';
  let html = '';
  for (let i = 1; i <= 3; i++) html += `<span class="star ${i<=n?'filled':''}">${i<=n?'★':'☆'}</span>`;
  return html;
}

function renderCard(t) {
  const s = STATUS_LABELS[t.status] || STATUS_LABELS.todo;
  const tagsHtml = (t.tags||[]).map(tag=>`<span class="tag ${tag}">${tag}</span>`).join('');
  const starsHtml = (t.stars||0) > 0 ? `<div class="card-stars">${'★'.repeat(t.stars)}</div>` : '';
  return `<div class="card" onclick="openModal(${t.id})">
    <span class="status-badge ${s.cls}">${s.label}</span>
    ${starsHtml}
    <div class="card-icon">${t.icon}</div>
    <div class="card-name">${t.name}</div>
    <div class="card-desc">${t.desc}</div>
    ${tagsHtml?`<div class="card-tags">${tagsHtml}</div>`:''}
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════════════════════════
function openModal(id) {
  const t = tools.find(x=>x.id===id);
  if (!t) return;
  currentToolId = id;
  const cat = CATEGORIES.find(c=>c.id===t.cat);
  document.getElementById('mIcon').innerHTML = `${t.icon} ${t.name}`;
  document.getElementById('mCat').textContent = `${cat?.icon||''} ${cat?.name||t.cat}`;
  document.getElementById('mDesc').textContent = t.desc;
  document.getElementById('mReadme').textContent = t.readme || '— brak opisu —';

  // Links
  let links = '';
  if (t.url) links += `<a class="link-btn primary" href="${t.url}" target="_blank" rel="noopener">🔗 GitHub / Strona</a>`;
  if (t.docs) links += `<a class="link-btn secondary" href="${t.docs}" target="_blank" rel="noopener">📖 Dokumentacja</a>`;
  document.getElementById('mLinks').innerHTML = links;

  // Star rating
  renderModalStars(t.stars || 0);

  // Status select
  const sel = document.getElementById('mStatusSel');
  sel.innerHTML = Object.entries(STATUS_LABELS).map(([k,v])=>
    `<option value="${k}" ${t.status===k?'selected':''}>${v.label}</option>`
  ).join('');

  document.getElementById('overlay').classList.add('open');
}

function changeStatus(val) {
  if (!currentToolId) return;
  const t = tools.find(x=>x.id===currentToolId);
  if (t) {
    t.status = val;
    renderCards(); renderSidebar();
    // Persist status change for user-added tools
    try {
      const added = JSON.parse(localStorage.getItem(LS_KEY_ADDED) || '[]');
      const idx = added.findIndex(a => a.url === t.url);
      if (idx >= 0) { added[idx].status = val; localStorage.setItem(LS_KEY_ADDED, JSON.stringify(added)); }
    } catch(e) {}
  }
  const note = document.getElementById('mStatusNote');
  note.textContent = '✓ Zapisano';
  setTimeout(()=>note.textContent='', 1500);
}

function renderModalStars(current) {
  const container = document.getElementById('mStarRating');
  let html = `<span class="star ${0===current?'filled':''}" onclick="setToolStars(0)" title="Usuń ocenę">✕</span>`;
  for (let i = 1; i <= 3; i++) {
    html += `<span class="star ${i<=current?'filled':''}" onclick="setToolStars(${i})" title="${i} ${'★'.repeat(i)}">★</span>`;
  }
  container.innerHTML = html;
}

function setToolStars(n) {
  if (!currentToolId) return;
  const t = tools.find(x => x.id === currentToolId);
  if (t) {
    t.stars = n;
    renderModalStars(n);
    renderCards(); renderSidebar();
    // Persist for user-added tools
    try {
      const added = JSON.parse(localStorage.getItem(LS_KEY_ADDED) || '[]');
      const idx = added.findIndex(a => a.url === t.url);
      if (idx >= 0) { added[idx].stars = n; localStorage.setItem(LS_KEY_ADDED, JSON.stringify(added)); }
    } catch(e) {}
    const note = document.getElementById('starSavedNote');
    note.classList.add('show');
    setTimeout(() => note.classList.remove('show'), 1200);
  }
}

function renderFormStars(containerId, current) {
  const container = document.getElementById(containerId);
  let html = '';
  for (let i = 1; i <= 3; i++) {
    html += `<span class="star ${i<=current?'filled':''}" onclick="setFormStars('${containerId}',${i})" style="cursor:pointer">★</span>`;
  }
  html += current > 0 ? ` <span class="star" onclick="setFormStars('${containerId}',0)" style="cursor:pointer;font-size:.7rem;color:var(--gray)" title="Usuń">✕</span>` : '';
  container.innerHTML = html;
}

const LS_KEY = 'zeno_catalog_tools';
const LS_KEY_ADDED = 'zeno_catalog_added';

function loadFromStorage() {
  try {
    const added = localStorage.getItem(LS_KEY_ADDED);
    if (added) {
      const parsed = JSON.parse(added);
      if (Array.isArray(parsed) && parsed.length > 0) {
        // Merge — dodaj tylko te których nie ma (po URL)
        const existingUrls = new Set(tools.map(t => t.url));
        parsed.forEach(t => {
          if (!existingUrls.has(t.url)) {
            tools.push(t);
            existingUrls.add(t.url);
          }
        });
      }
    }
  } catch(e) { console.warn('loadFromStorage error:', e); }
}

function saveAddedToStorage(tool) {
  try {
    const added = JSON.parse(localStorage.getItem(LS_KEY_ADDED) || '[]');
    added.push(tool);
    localStorage.setItem(LS_KEY_ADDED, JSON.stringify(added));
  } catch(e) { console.warn('saveAddedToStorage error:', e); }
}

  search:     ['search', 'elasticsearch', 'solr', 'meilisearch', 'typesense', 'lucene', 'indexer', 'full-text', 'searx', 'qdrant', 'weaviate', 'vector search'],
  ai:         ['ai', 'ml', 'machine-learning', 'deep-learning', 'llm', 'gpt', 'transformer', 'neural', 'embedding', 'vector', 'rag', 'nlp', 'huggingface', 'openai', 'langchain', 'semantic-kernel', 'ollama', 'onnx'],

  analytics:  ['analytics', 'monitoring', 'metrics', 'logging', 'observability', 'tracing', 'apm', 'grafana', 'prometheus', 'plausible', 'matomo', 'posthog'],
  networking: ['network', 'dns', 'proxy', 'vpn', 'firewall', 'cloudflare', 'nginx', 'haproxy', 'traefik', 'suricata', 'packet', 'tcp', 'udp', 'http', 'tls', 'ssl'],
  dashboard:  ['dashboard', 'admin-panel', 'homepage', 'status-page', 'startpage', 'glance', 'osquery'],

  cms:        ['cms', 'static-site', 'blog', 'wordpress', 'ghost', 'hugo', 'gatsby', 'next', 'website-builder', 'landing-page', 'template'],

  dotnet:     ['.net', 'dotnet', 'csharp', 'c#', 'nuget', 'aspnet', 'asp.net', 'blazor', 'maui', 'wpf', 'ef-core', 'entity-framework'],
};

function detectCategory(name, desc, topics, language) {
  const text = [name, desc, ...(topics || []), language || ''].join(' ').toLowerCase();
  let bestCat = 'bookmark'; // fallback
  let bestScore = 0;

  for (const [catId, keywords] of Object.entries(CAT_KEYWORDS)) {
    let score = 0;
    keywords.forEach(kw => {
      if (text.includes(kw)) score += (kw.length > 5 ? 2 : 1);
    });
    if (score > bestScore) { bestScore = score; bestCat = catId; }
  }
  return bestCat;
}

function detectTags(language, topics) {
  const tags = [];
  const langMap = {
    'rust': 'rust', 'python': 'python', 'go': 'go', 'golang': 'go',
    'typescript': 'ts', 'javascript': 'ts', 'java': 'java',
    'c#': 'dotnet', 'csharp': 'dotnet', 'c++': '', 'ruby': '', 'php': '',
  };
  if (language && langMap[language.toLowerCase()]) {
    tags.push(langMap[language.toLowerCase()]);
  }
  const topicStr = (topics || []).join(' ').toLowerCase();
  if (topicStr.includes('self-host') || topicStr.includes('selfhost') || topicStr.includes('docker') || topicStr.includes('self-hosted')) tags.push('selfhosted');
  if (topicStr.includes('ai') || topicStr.includes('machine-learning') || topicStr.includes('llm') || topicStr.includes('deep-learning')) tags.push('ai');
  return [...new Set(tags.filter(Boolean))];
}

function detectIcon(cat, topics) {
  const iconMap = {
    search: '🔍', ai: '🧠', devtools: '🛠️', analytics: '📊',
    networking: '🌐', dashboard: '📈', scraping: '🕷️', cms: '📝',
    social: '💬', ecommerce: '🛒', bookmark: '📚', dotnet: '🔷',
  };
  return iconMap[cat] || '🔧';
}

function parseGitHubUrl(url) {
  // Match github.com/owner/repo (optionally with trailing path)
  const m = url.match(/github\.com\/([^\/]+)\/([^\/\?#]+)/);
  if (m) return { owner: m[1], repo: m[2].replace(/\.git$/, '') };
  return null;
}

async function fetchGitHubData(owner, repo) {
  const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`, {
    headers: { 'Accept': 'application/vnd.github.v3+json' }
  });
  if (!res.ok) throw new Error(`GitHub API: ${res.status} ${res.statusText}`);
  return res.json();
}

async function fetchGenericMetadata(url) {
  // Use allorigins as CORS proxy
  const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
  const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(12000) });
  if (!res.ok) throw new Error(`Fetch error: ${res.status}`);
  const html = await res.text();

  const getMetaContent = (nameOrProp) => {
    // Try name="..." and property="..."
    for (const attr of ['name', 'property']) {
      const rx = new RegExp(`<meta[^>]+${attr}=["']${nameOrProp}["'][^>]+content=["']([^"']+)["']`, 'i');
      const m = html.match(rx);
      if (m) return m[1];
      // Reversed order: content before name
      const rx2 = new RegExp(`<meta[^>]+content=["']([^"']+)["'][^>]+${attr}=["']${nameOrProp}["']`, 'i');
      const m2 = html.match(rx2);
      if (m2) return m2[1];
    }
    return '';
  };

  const titleMatch = html.match(/<title[^>]*>([^<]+)<\/title>/i);
  const title = getMetaContent('og:title') || (titleMatch ? titleMatch[1].trim() : '');
  const description = getMetaContent('og:description') || getMetaContent('description') || '';
  const keywords = getMetaContent('keywords') || '';

  return { title, description, keywords, url };
}

async function doAutoFetch() {
  const urlInput = document.getElementById('afUrl');
  const statusEl = document.getElementById('afStatus');
  const fetchBtn = document.getElementById('afFetchBtn');
  const preview = document.getElementById('afPreview');

  let url = urlInput.value.trim();
  if (!url) { statusEl.textContent = '⚠️ Wklej URL'; statusEl.className = 'af-status error'; return; }
  if (!url.startsWith('http')) url = 'https://' + url;

  statusEl.textContent = '⏳ Pobieranie metadanych...';
  statusEl.className = 'af-status';
  fetchBtn.disabled = true;

  try {
    const gh = parseGitHubUrl(url);

    if (gh) {
      // ── GitHub repo ──
      statusEl.textContent = '⏳ Pobieranie danych z GitHub API...';
      const data = await fetchGitHubData(gh.owner, gh.repo);

      const cat = detectCategory(data.name, data.description || '', data.topics || [], data.language);
      const tags = detectTags(data.language, data.topics);
      const icon = detectIcon(cat, data.topics);

      // Stars info
      const starsStr = data.stargazers_count ? `⭐ ${data.stargazers_count.toLocaleString()} stars` : '';
      const langStr = data.language ? `Język: ${data.language}` : '';
      const licenseStr = data.license?.spdx_id ? `Licencja: ${data.license.spdx_id}` : '';
      const topicsStr = (data.topics || []).length ? `Topics: ${data.topics.join(', ')}` : '';

      const readme = [data.description, '', starsStr, langStr, licenseStr, topicsStr]
        .filter(Boolean).join('\n');

      document.getElementById('afIcon').value = icon;
      document.getElementById('afName').value = data.name;
      document.getElementById('afDesc').value = (data.description || '').substring(0, 80);
      document.getElementById('afReadme').value = readme;
      document.getElementById('afCat').value = cat;
      document.getElementById('afMainUrl').value = data.html_url;
      document.getElementById('afDocs').value = data.homepage || '';
      document.getElementById('afTags').value = tags.join(', ');

      statusEl.textContent = `✅ Pobrano z GitHub: ${data.full_name} (${starsStr})`;
      statusEl.className = 'af-status success';

    } else {
      // ── Generic website ──
      statusEl.textContent = '⏳ Pobieranie metadanych strony...';
      const data = await fetchGenericMetadata(url);

      const cleanName = data.title.split(/[|\-–—]/)[0].trim() || new URL(url).hostname;
      const cat = detectCategory(cleanName, data.description, data.keywords.split(','), '');
      const icon = detectIcon(cat);
      const tags = [];
      if (data.keywords) {
        data.keywords.split(',').slice(0, 3).forEach(k => {
          const kw = k.trim().toLowerCase();
          if (['rust','python','go','ts','java','ai','selfhosted','dotnet'].includes(kw)) tags.push(kw);
        });
      }

      document.getElementById('afIcon').value = icon;
      document.getElementById('afName').value = cleanName.substring(0, 50);
      document.getElementById('afDesc').value = (data.description || '').substring(0, 80);
      document.getElementById('afReadme').value = data.description || '';
      document.getElementById('afCat').value = cat;
      document.getElementById('afMainUrl').value = url;
      document.getElementById('afDocs').value = '';
      document.getElementById('afTags').value = tags.join(', ');

      statusEl.textContent = `✅ Pobrano metadane strony`;
      statusEl.className = 'af-status success';
    }

    preview.classList.add('visible');
  } catch (err) {
    console.error('Auto-fetch error:', err);
    statusEl.textContent = `❌ Błąd: ${err.message}`;
    statusEl.className = 'af-status error';
    // Still show form for manual entry
    document.getElementById('afMainUrl').value = url;
    preview.classList.add('visible');
  } finally {
    fetchBtn.disabled = false;
  }
}
